<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menú Navideño 2026</title>
<meta name="description" content="Haz tu pedido navideño: elige, personaliza y envíalo por WhatsApp.">
<meta name="theme-color" content="#ff6b7a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#ff8a78; --rosa:#ff4070; --durazno:#f9bd86;
    --grad:linear-gradient(90deg,#ff8f77 0%,#ff3d6e 100%);
    --grad-v:linear-gradient(180deg,#ff8a78 0%,#ff4070 100%);
    --fondo:#fafafa; --tinta:#262626; --suave:#777; --linea:#d9d9d9; --blanco:#fff;
    --radio:18px;
    --logo:"Comfortaa","Varela Round",system-ui,sans-serif;
    --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--sans);color:var(--tinta);background:var(--fondo);line-height:1.45;
       padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  body.sin-scroll{overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;touch-action:manipulation}
  a,label,.tarjeta,.chip{touch-action:manipulation}
  em{font-style:normal;font-size:.75rem;color:var(--suave);font-weight:400;margin-left:.35rem}
  svg{display:block}

  /* ---------- portada (degradado coral → rosa) ---------- */
  .portada{min-height:88vh;min-height:88svh;color:#fff;text-align:center;
           background:linear-gradient(180deg,rgba(40,8,20,.35) 0%,rgba(120,20,50,.45) 50%,rgba(255,64,112,.85) 100%),
                      url("fotos/fondo.jpg") center 45%/cover no-repeat,var(--grad-v);
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;
           padding:calc(2rem + env(safe-area-inset-top)) 1.5rem 3rem}
  .portada .logo,.portada .eslogan,.portada .lema{text-shadow:0 2px 14px rgba(40,0,15,.45)}
  .portada .logo{font-family:var(--logo);font-weight:700;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.05;margin:0;letter-spacing:-.01em}
  .portada .eslogan{font-style:italic;font-size:1.15rem;color:var(--durazno);margin:.2rem 0 0}
  .portada .lema{max-width:30rem;margin:.9rem auto 0;opacity:.95;font-size:.95rem}
  .portada .fechas{display:inline-block;margin-top:.4rem;padding:.4rem 1rem;border-radius:999px;background:rgba(255,255,255,.2);font-size:.82rem}
  .portada .acciones-portada{width:100%;max-width:19rem;margin-top:2.2rem;display:flex;flex-direction:column;gap:.8rem}
  .portada .btn-borde{background:rgba(255,255,255,.12);backdrop-filter:blur(4px)}

  /* ---------- botones (píldoras) ---------- */
  .btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;border:0;border-radius:999px;
       padding:.95rem 1.4rem;min-height:52px;font-weight:600;font-size:1rem;text-decoration:none}
  .btn:active,.btn-paso:active,.chip:active{transform:scale(.97)}
  .btn-blanco{background:#fff;color:var(--rosa);font-size:1.15rem;padding:1.1rem 1.4rem}
  .btn-borde{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.85)}
  .btn-primario,.btn-whats{justify-content:space-between}
  .btn-primario{background:var(--grad);color:#fff;margin-top:1.1rem;box-shadow:0 6px 16px rgba(255,64,112,.3)}
  .btn-whats{background:#1f8f4e;color:#fff;margin-top:.8rem}
  .btn-suave{background:#fff;color:var(--rosa);border:2px solid #ffd2d9;margin-top:.7rem}
  .btn-texto{background:none;color:var(--suave);text-decoration:underline;font-weight:500;margin-top:.2rem}
  .btn:focus-visible,.chip:focus-visible,.btn-paso:focus-visible,.tarjeta:focus-visible,.nav button:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}

  /* ---------- categorías ---------- */
  .cats{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.96);backdrop-filter:blur(6px);
        display:flex;gap:.5rem;overflow-x:auto;padding:.7rem 1rem;scrollbar-width:none;border-bottom:1px solid #eee;
        scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  .cats::-webkit-scrollbar{display:none}
  .chip-cat{flex:none;text-decoration:none;color:var(--tinta);background:#fff;border:1.5px solid #ececec;
            padding:.6rem 1.05rem;min-height:44px;display:flex;align-items:center;border-radius:999px;font-weight:600;font-size:.88rem;white-space:nowrap;scroll-snap-align:center}
  .chip-cat.activo{background:var(--tinta);color:#fff;border-color:var(--tinta)}
  .chip-ayuda{flex:none;background:var(--grad);color:#fff;border:0;padding:.6rem 1.1rem;min-height:44px;border-radius:999px;font-weight:600;font-size:.88rem;white-space:nowrap}

  /* ---------- menú (feed de tarjetas con imagen grande) ---------- */
  main{max-width:980px;margin:0 auto;padding:0 1rem}
  .categoria{padding-top:1.8rem;scroll-margin-top:68px}
  .categoria h2{font-family:var(--logo);font-weight:700;font-size:1.55rem;margin:0 0 1rem;
                background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
  .rejilla{display:grid;gap:1.4rem;grid-template-columns:1fr}
  @media(min-width:720px){.rejilla{grid-template-columns:1fr 1fr}}
  .tarjeta{display:flex;flex-direction:column;gap:.55rem;text-align:left;width:100%;background:none;border:0;padding:0}
  .foto,.foto-hoja{position:relative;display:block;overflow:hidden;background:color-mix(in srgb,var(--c) 40%,#fff)}
  .foto{aspect-ratio:16/10;border-radius:var(--radio);transition:transform .15s,box-shadow .15s}
  .foto img,.foto-hoja img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  /* sin foto propia: imagen de fondo con otro encuadre en cada tarjeta + tinte de la categoría */
  .generica{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 18%,transparent),color-mix(in srgb,var(--c) 45%,transparent)),
            url("fotos/fondo.jpg") var(--pos,50% 50%)/190% auto no-repeat,color-mix(in srgb,var(--c) 40%,#fff)}
  @media(hover:hover){.tarjeta:hover .foto{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.12)}}
  .tarjeta:active .foto{transform:scale(.985)}
  .mas{position:absolute;right:.7rem;bottom:.7rem;width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;
       display:grid;place-items:center;font-size:1.6rem;line-height:1;padding-bottom:3px;box-shadow:0 4px 12px rgba(255,64,112,.45)}
  .fila{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;padding:0 .2rem}
  .nombre{font-weight:600;font-size:1.05rem}
  .precio{color:var(--rosa);font-weight:700;font-size:.92rem;white-space:nowrap}
  .desc{color:var(--suave);font-size:.88rem;padding:0 .2rem}

  /* ---------- barra de navegación inferior ---------- */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-radius:22px 22px 0 0;
       box-shadow:0 -6px 22px rgba(0,0,0,.08);padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));
       display:grid;grid-template-columns:1fr auto 1fr;align-items:end;max-width:640px;margin:0 auto}
  .nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15rem;
       font-size:.72rem;font-weight:600;color:var(--tinta);padding:.3rem;min-height:52px;justify-content:center}
  .nav .ico{position:relative}
  .nav .ico b{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--grad);color:#fff;
       font-size:.68rem;display:grid;place-items:center;padding:0 4px}
  .nav .centro{width:66px;height:66px;min-height:0;border-radius:50%;background:var(--grad);color:#fff;margin:-32px .6rem 0;padding:0;
       justify-content:center;border:5px solid #fff;box-shadow:0 6px 16px rgba(255,64,112,.4)}

  /* ---------- modales ---------- */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(30,20,22,.5);display:flex;align-items:flex-end;justify-content:center}
  .panel{position:relative;background:var(--fondo);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;
         display:flex;flex-direction:column;overflow:hidden;border-radius:24px 24px 0 0;animation:sube .22s ease-out}
  .panel:empty{display:none}
  .cuerpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
          padding:1.5rem 1.3rem 1.2rem;scroll-padding-bottom:1rem}
  .pie{flex:none;background:#fff;border-top:1px solid #eee;box-shadow:0 -6px 18px rgba(0,0,0,.06);
       padding:.75rem 1.3rem calc(.75rem + env(safe-area-inset-bottom))}
  .pie .btn{margin-top:0}
  .pie-fila{display:flex;gap:.7rem}
  .pie-fila .btn-primario{flex:1}
  .btn-atras{width:auto;flex:none;margin-top:0;padding-left:1.4rem;padding-right:1.4rem}
  .foto-hoja{height:clamp(130px,26vh,200px);margin:-1.5rem -1.3rem 1.1rem;
             background-color:color-mix(in srgb,var(--c) 40%,#fff)}
  @keyframes sube{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:720px){.modal{align-items:center}.panel{border-radius:24px;max-height:90vh}}
  .panel h3{font-family:var(--logo);font-weight:700;color:var(--rosa);font-size:1.5rem;margin:0 2.6rem .3rem 0}
  .panel h3:first-child{margin-top:.2rem}
  .panel h4{font-family:var(--logo);color:var(--rosa);margin:1.5rem 0 .2rem;font-size:1.1rem}
  .cerrar{position:absolute;top:.8rem;right:.8rem;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
          color:var(--tinta);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .desc-hoja{color:var(--suave);margin:.2rem 0;font-size:.92rem}
  .precio-hoja{color:var(--rosa);font-weight:700;margin:.2rem 0 .6rem}
  .chico{font-size:.82rem;color:var(--suave)}
  .grupo{border:0;padding:0;margin:1.1rem 0 0;display:block}
  .grupo legend,.etiqueta{font-weight:600;display:block;margin-bottom:.45rem;padding:0}
  .opcion{display:flex;align-items:center;gap:.75rem;padding:.8rem 1rem;min-height:52px;border:1.5px solid #ececec;border-radius:14px;
          margin-bottom:.45rem;background:#fff;cursor:pointer}
  .opcion input{accent-color:var(--rosa);width:1.35rem;height:1.35rem;flex:none}
  .opcion span{flex:1}
  .opcion small{color:var(--suave)}
  .opcion:has(input:checked){border-color:var(--rosa);background:#fff3f5}
  .paso{display:inline-flex;align-items:center;gap:.7rem;background:#fff;border:1.5px solid #ececec;border-radius:999px;padding:.3rem}
  .paso output{min-width:5.5rem;text-align:center;font-weight:600}
  .btn-paso{width:48px;height:48px;border-radius:50%;border:0;background:#ffe3e8;color:var(--rosa);font-size:1.5rem;line-height:1;font-weight:600}
  .paso-chico .btn-paso{width:42px;height:42px;font-size:1.3rem}
  .paso-chico output{min-width:4.4rem;font-size:.88rem}
  .paso-grande{margin:.2rem 0}.paso-grande output{font-size:1.6rem;min-width:4rem}
  .campo{display:block;margin-top:1.1rem}
  .campo>span{display:block;font-weight:600;margin-bottom:.1rem;font-size:.85rem;color:var(--suave)}
  .campo small{display:block;color:var(--suave);margin-top:.3rem}
  /* campos con línea inferior, como en la referencia */
  input[type=text],input:not([type]),input[type=tel],input[type=date],select,textarea{width:100%;border:0;border-bottom:1.5px solid #8c8c8c;
     border-radius:0;padding:.75rem .1rem;min-height:48px;background:transparent;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--rosa)}
  textarea{resize:vertical}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:420px){.dos{grid-template-columns:1fr}}
  .error{color:var(--rosa);font-weight:600;margin:.6rem 0 0}
  .errores{background:#fff0f2;border:1px solid #ffc4cd;color:#b3103a;border-radius:14px;padding:.7rem 1rem .7rem 1.8rem;margin:1.1rem 0 0}
  .exito{background:#e8f5ec;border:1px solid #a8d5b5;color:#1d5c34;border-radius:14px;padding:.7rem 1rem;margin:1.1rem 0 0}
  .vacio{color:var(--suave);margin:1rem 0}

  /* ---------- líneas de pedido ---------- */
  .lineas{list-style:none;padding:0;margin:1rem 0 0}
  .linea{display:flex;justify-content:space-between;gap:.8rem;padding:.85rem 0;border-bottom:1px dotted #ddd}
  .linea-info{display:flex;flex-direction:column;gap:.15rem;flex:1;min-width:0}
  .linea-der{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
  .nota{font-style:italic}
  .motivo{color:#d6335f}
  .sub{white-space:nowrap}
  .quitar{background:none;border:0;color:var(--rosa);text-decoration:underline;font-size:.88rem;padding:.7rem .4rem;min-height:44px;margin:-.3rem -.4rem -.5rem 0}
  .total{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;padding:.9rem 0 .2rem}
  .total strong{font-family:var(--logo);font-size:1.45rem;color:var(--rosa)}

  /* ---------- asistente ---------- */
  .chat{display:flex;flex-direction:column;gap:.55rem;margin-top:1rem}
  .burbuja{max-width:88%;padding:.7rem .95rem;border-radius:18px;font-size:.95rem}
  .burbuja.bot{background:#fff;border:1.5px solid #f0f0f0;border-bottom-left-radius:4px;align-self:flex-start}
  .burbuja.yo{background:var(--grad);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .respuestas{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .respuestas .btn{margin-top:.4rem;justify-content:center}
  .chip{background:#fff;border:1.5px solid #ececec;border-radius:999px;padding:.75rem 1.1rem;min-height:48px;font-weight:600;font-size:.95rem}
  @media(max-width:560px){.respuestas{flex-direction:column;align-items:stretch}.respuestas .chip{text-align:left;border-radius:16px}.respuestas .paso{align-self:center}}
  .chip.activo{background:var(--grad);color:#fff;border-color:transparent}
  .propuesta{background:#fff;border:1.5px solid #f0f0f0;border-radius:var(--radio);padding:.4rem 1rem 1rem}
  .mini-sel{display:flex;align-items:center;gap:.6rem;margin-top:.35rem;font-size:.85rem}
  .mini-sel{flex-wrap:wrap}.mini-sel select{width:auto;flex:1;min-width:8rem;padding:.5rem .2rem;font-size:16px}
  .acciones{margin-top:.6rem}

  .toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(.9rem + env(safe-area-inset-top));z-index:30;
         background:var(--tinta);color:#fff;padding:.7rem 1.2rem;border-radius:999px;max-width:92vw;text-align:center;font-size:.9rem}
  footer{max-width:980px;margin:2.5rem auto 0;padding:0 1.2rem;color:var(--suave);font-size:.8rem;text-align:center}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="portada">
  <h1 class="logo" id="titulo">Menú Navideño</h1>
  <p class="eslogan">Elige. Personaliza. Pide.</p>
  <p class="lema" id="lema"></p>
  <span class="fechas" id="fechas"></span>
  <div class="acciones-portada">
    <a class="btn btn-blanco" href="#menu">Explorar</a>
    <button class="btn btn-borde" data-acc="asistente">Ayúdame a elegir</button>
  </div>
</header>

<nav class="cats" id="cats" aria-label="Categorías del menú"></nav>
<main id="menu"></main>
<footer>Los precios son por kilo, litro o pieza según se indica. El total final y la disponibilidad se confirman por WhatsApp.</footer>

<nav class="nav" id="barra" aria-label="Navegación principal">
  <button data-acc="inicio" aria-label="Ir al inicio">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Menú</span>
  </button>
  <button class="centro" data-acc="asistente" aria-label="Ayúdame a elegir">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z"/></svg>
  </button>
  <button data-acc="carrito" aria-label="Ver mi pedido">
    <span class="ico">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm0 10c-2.76 0-5-2.24-5-5h2c0 1.66 1.34 3 3 3s3-1.34 3-3h2c0 2.76-2.24 5-5 5z"/></svg>
      <b id="barra-n" hidden></b>
    </span>
    <span id="barra-texto">Mi pedido</span>
  </button>
</nav>

<div class="modal" id="hoja" hidden role="dialog" aria-modal="true" aria-label="Detalle del platillo"><div class="panel" id="hoja-panel"></div></div>
<div class="modal" id="carrito" hidden role="dialog" aria-modal="true" aria-label="Mi pedido"><div class="panel" id="carrito-panel"></div></div>
<div class="modal" id="asistente" hidden role="dialog" aria-modal="true" aria-label="Asistente para elegir"><div class="panel" id="asistente-panel"></div></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
